# Production (and staging) stack on one VM. See docs/OPERATIONS.md.
#
#   cd /opt/lottery-passport/deploy && docker compose -f compose.prod.yml up -d
#
# Secrets and settings come from ./.env (mode 600, never committed); start from
# .env.production.example. Only nginx publishes ports. The API port is reachable
# only inside the Compose network, which is why the API may trust the
# X-Forwarded-For header that nginx sets.
name: lottery-passport

x-app: &app
  build:
    context: ..
    dockerfile: Dockerfile
    args:
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
  image: lottery-passport-api:${RELEASE:-local}
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  nginx:
    # Pin by digest after the first pull: nginx:1.27-alpine@sha256:<digest>
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - /etc/lottery-passport/nginx:/etc/nginx/site:ro   # lounge_ips.conf, admin_allow.conf
      - /etc/lottery-passport/tls:/etc/nginx/tls:ro      # fullchain.pem, privkey.pem
      # Mount the PARENT directory: a bind mount pins the directory it was
      # started with, so swapping pwa/ for a new release would go unnoticed.
      # Paths under the parent are resolved per request, so the swap is atomic.
      - /srv/lottery-passport:/srv/site:ro                # pwa/ (Arman's dist/) and acme/
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  api:
    <<: *app
    command:
      - uvicorn
      - main:app
      - --host=0.0.0.0
      - --port=8000
      - --workers=4
      - --proxy-headers
      - --forwarded-allow-ips=*
    expose:
      - "8000"

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    # Enabled by COMPOSE_PROFILES=worker in .env once the jobs worker exists (B11).
    profiles: ["worker"]

  postgres:
    # Pin by digest after the first pull.
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: UTC
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - max_connections=100
      - -c
      - idle_in_transaction_session_timeout=60s
      - -c
      - log_min_duration_statement=500ms
      - -c
      - timezone=UTC
    shm_size: 256mb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  pgdata:
