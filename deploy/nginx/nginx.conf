# nginx for play.<domain>: TLS, the static PWA, the API, the admin panel.
# Replace play.example.ir with the real host name (two places). See
# docs/OPERATIONS.md#nginx for what each block is for.

user nginx;
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;

    # Codes travel in QR URLs (/r/<code>): never write them to the access log.
    map $request_uri $loggable_uri {
        ~^/r/   /r/[redacted];
        default $request_uri;
    }
    log_format redacted '$remote_addr [$time_iso8601] "$request_method $loggable_uri" '
                        '$status $body_bytes_sent $request_time "$http_user_agent" $request_id';
    access_log /var/log/nginx/access.log redacted;

    # Lounges put every player behind ONE public IP. Per-IP limits would lock a
    # whole lounge out, so lounge IPs (site/lounge_ips.conf, lines like
    # "203.0.113.10 1;") get their own, much larger budget.
    geo $is_lounge {
        default 0;
        include /etc/nginx/site/lounge_ips.conf;
    }
    map $is_lounge $public_key {
        0 $binary_remote_addr;
        1 "";
    }
    map $is_lounge $lounge_key {
        0 "";
        1 $binary_remote_addr;
    }
    # Requests whose key is empty are not counted by that zone.
    limit_req_zone $public_key zone=api_public:20m rate=10r/s;
    limit_req_zone $lounge_key zone=api_lounge:1m  rate=300r/s;
    limit_req_zone $public_key zone=otp_public:10m rate=6r/m;
    limit_req_zone $lounge_key zone=otp_lounge:1m  rate=120r/m;
    limit_req_status 429;

    upstream api {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name play.example.ir;

        location /.well-known/acme-challenge/ {
            root /srv/site/acme;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name play.example.ir;

        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;

        # add_header in a location REPLACES the server-level ones, so every
        # location that adds a header includes the security headers again.
        include /etc/nginx/snippets/security_headers.conf;

        client_max_body_size 16k;
        error_page 429 = @rate_limited;

        location @rate_limited {
            default_type application/json;
            include /etc/nginx/snippets/security_headers.conf;
            add_header Retry-After 10 always;
            return 429 '{"error":{"code":"RATE_LIMITED","message":"rate limit exceeded"}}';
        }

        location = /api/v1/auth/request {
            limit_req zone=otp_public burst=3 nodelay;
            limit_req zone=otp_lounge burst=40 nodelay;
            include /etc/nginx/snippets/proxy_api.conf;
        }

        location /api/ {
            limit_req zone=api_public burst=40 nodelay;
            limit_req zone=api_lounge burst=600 nodelay;
            include /etc/nginx/snippets/proxy_api.conf;
        }

        location = /health {
            access_log off;
            include /etc/nginx/snippets/proxy_api.conf;
        }

        location = /ready {
            access_log off;
            include /etc/nginx/snippets/proxy_api.conf;
        }

        # The API's interactive docs stay internal in production.
        location ~ ^/(docs|redoc|openapi\.json)$ {
            return 404;
        }

        # Admin panel: office/VPN/lounge IPs only (site/admin_allow.conf holds
        # "allow 198.51.100.7;" lines). Everyone else gets 403.
        location /admin {
            include /etc/nginx/site/admin_allow.conf;
            deny all;
            client_max_body_size 1m;
            include /etc/nginx/snippets/proxy_api.conf;
        }

        # The PWA: fingerprinted assets cached for a year, index.html never.
        root /srv/site/pwa;

        location /assets/ {
            include /etc/nginx/snippets/security_headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location / {
            include /etc/nginx/snippets/security_headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri /index.html;
        }
    }
}
